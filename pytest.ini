; 这个文件的存在本身就是关键：pytest 靠它确定 rootdir。
;
; 没有它的时候，pytest 会从 tests/ 一路往上找配置，越过本仓库走到父目录
; respect_comfyui/ —— 那是个 ComfyUI 自定义节点仓库，根上有 __init__.py，
; 于是 pytest 把整个仓库当成一个包去 import，撞上没装的 torch，
; 17 个测试全部 collect 失败。仓库里带着测试却从来跑不起来。
;
; pythonpath = . 让 tests/ 里的 `from core import ...` 能找到本仓库的 core，
; 不用每个测试文件自己插 sys.path。

[pytest]
testpaths = tests
pythonpath = .
addopts = -q
