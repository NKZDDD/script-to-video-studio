# Add to the HTTPS server block for a DEDICATED auth domain in BaoTa Nginx.
# Replace any existing location / for that site; do not add a duplicate.
# Keep BaoTa certificate settings and enable HTTP -> HTTPS redirect there.
location / {
    proxy_pass http://127.0.0.1:8781;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    # Allow admin JSON imports; the application still limits each API separately.
    client_max_body_size 3m;
    proxy_cache off;
    # No request body, Authorization, or token logging.
    access_log off;
}
