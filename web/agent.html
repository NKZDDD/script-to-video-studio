<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Respect Studio · Agent 生产工作台</title><link rel="stylesheet" href="/agent.css"><link rel="icon" href="data:,"><script src="/agent.js" defer></script></head>
<body><div id="studio-agent-prototype">
<header class="rv-top"><div class="rv-brand"><span class="rv-mark">R</span><div><strong>Respect Studio</strong><small>Agent 材料 · 本机生产</small></div></div><label class="rv-project-picker"><span class="rv-sr">当前项目</span><select id="project-picker" aria-label="当前项目"><option value="">选择项目</option></select></label><nav class="rv-nav" aria-label="主导航"><button data-page="projects">项目</button><button data-page="production">生产</button><button data-page="outputs">产物</button><button data-page="settings">设置</button></nav></header>
<details class="rv-runtime" id="runtime"><summary><span class="rv-badge">运行状态</span><span>生产并发 <b id="live-inflight">—</b></span><span>运行 <b id="live-jobs">—</b></span><span>当前线程 <b id="live-threads">—</b></span><span>建议并发 <b id="live-advice">待采样</b></span></summary><div class="rv-runtime-body"><div id="live-usage"></div><p id="live-basis"></p><p class="rv-caption">线程数包含本程序所有线程；生产并发只计图片与视频的在途任务。多项目共享全局与服务商额度。</p><button class="rv-button" id="apply-advice">将建议值填入并发设置</button></div></details>
<div id="message" role="status" hidden></div><main class="rv-main" id="main"><p>正在读取本机项目与服务商配置…</p></main>
<dialog id="dialog"><div class="rv-row"><h3 id="dialog-title"></h3><button class="rv-button" id="dialog-close" aria-label="关闭对话框">关闭</button></div><div id="dialog-body"></div></dialog>
<noscript>请启用 JavaScript 后使用工作台。</noscript></div></body></html>
